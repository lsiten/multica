name: Fork Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: read

concurrency:
  group: fork-desktop-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'lsiten/multica'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$RELEASE_TAG" == *-dirty* || ${#RELEASE_TAG} -gt 128 ]]; then
            echo "::error::Expected vX.Y.Z or vX.Y.Z-prerelease, without a dirty suffix."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check desktop types and tests
        shell: bash
        run: |
          node --test scripts/fork-desktop.test.mjs
          pnpm --filter @multica/desktop typecheck
          pnpm --filter @multica/desktop test
      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: node --input-type=module -e "import { strict as assert } from 'node:assert'; import { deriveVersion } from './apps/desktop/scripts/package.mjs'; assert.equal(deriveVersion(), process.env.RELEASE_TAG.slice(1));"
      - name: Package desktop installers
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.target == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm run package -- --${{ matrix.target }} --x64 --arm64 --publish never
      - name: Check installers and update metadata
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "$TARGET" in
            mac) platform=mac; extensions=(dmg zip) ;;
            win) platform=windows; extensions=(exe) ;;
            linux) platform=linux; extensions=(AppImage deb rpm) ;;
          esac
          for arch in x64 arm64; do
            directory="apps/desktop/dist/${TARGET}-${arch}"
            for extension in "${extensions[@]}"; do
              package_arch="$arch"
              case "$TARGET:$arch:$extension" in
                linux:x64:deb) package_arch=amd64 ;;
                linux:x64:*) package_arch=x86_64 ;;
                linux:arm64:rpm) package_arch=aarch64 ;;
              esac
              artifact="$directory/multica-desktop-${RELEASE_TAG#v}-${platform}-${package_arch}.${extension}"
              if [[ ! -s "$artifact" ]]; then
                echo "::error::Missing installer: $artifact"
                exit 1
              fi
            done
            metadata=("$directory/"*.yml)
            test "${#metadata[@]}" -gt 0
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fork-desktop-${{ matrix.target }}
          path: |
            apps/desktop/dist/*/multica-desktop-*
            apps/desktop/dist/*/*.yml
            !apps/desktop/dist/*/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fork-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Publish complete desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ "$name" == "builder-debug.yml" ]]; then
              continue
            fi
            if [[ -e "release-assets/$name" ]]; then
              echo "::error::Duplicate release asset: $name"
              exit 1
            fi
            cp "$asset" "release-assets/$name"
          done < <(find artifacts -type f -print0)
          assets=(release-assets/*)
          test -f "${assets[0]}"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "::error::Release is already public; use a new version tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --draft --prerelease="$PRERELEASE" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
          echo "Desktop release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
