{{- if .Values.turn.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-turn
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: turn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multica
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: turn
  template:
    metadata:
      labels:
        {{- include "multica.labels" . | nindent 8 }}
        app.kubernetes.io/component: turn
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/turn-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: turn
          image: "{{ .Values.images.turn.repository }}:{{ default .Chart.AppVersion .Values.images.turn.tag }}"
          imagePullPolicy: {{ .Values.images.turn.pullPolicy }}
          command:
            - sh
            - -c
            - >-
              exec turnserver
              -c /etc/coturn/turnserver.conf
              --realm="${MULTICA_TURN_PUBLIC_HOST}"
              --use-auth-secret
              --static-auth-secret="${MULTICA_TURN_SECRET:-${JWT_SECRET}}"
              --min-port="${TURN_MIN_PORT}"
              --max-port="${TURN_MAX_PORT}"
              --log-file=stdout
              ${MULTICA_TURN_EXTERNAL_IP:+--external-ip="$MULTICA_TURN_EXTERNAL_IP"}
          env:
            - name: TURN_MIN_PORT
              value: {{ .Values.turn.service.relay.minPort | quote }}
            - name: TURN_MAX_PORT
              value: {{ .Values.turn.service.relay.maxPort | quote }}
            {{- with .Values.turn.externalIP }}
            - name: MULTICA_TURN_EXTERNAL_IP
              value: {{ . | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
            - configMapRef:
                name: {{ .Release.Name }}-config
          ports:
            - containerPort: 3478
              name: turn-udp
              protocol: UDP
            - containerPort: 3478
              name: turn-tcp
              protocol: TCP
          volumeMounts:
            - name: turn-config
              mountPath: /etc/coturn/turnserver.conf
              subPath: turnserver.conf
              readOnly: true
          resources:
            {{- toYaml .Values.turn.resources | nindent 12 }}
      volumes:
        - name: turn-config
          configMap:
            name: {{ .Release.Name }}-turn-config
      {{- with .Values.turn.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.turn.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-turn
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: turn
spec:
  type: {{ .Values.turn.service.type }}
  {{- with .Values.turn.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  externalTrafficPolicy: {{ .Values.turn.service.externalTrafficPolicy }}
  selector:
    app.kubernetes.io/name: multica
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: turn
  ports:
    - name: turn-udp
      port: {{ .Values.turn.service.port }}
      targetPort: 3478
      protocol: UDP
    - name: turn-tcp
      port: {{ .Values.turn.service.port }}
      targetPort: 3478
      protocol: TCP
    {{- if .Values.turn.service.relay.enabled }}
    # coturn relays media for symmetric-NAT peers from this UDP range. A
    # cloud LoadBalancer forwards the whole range; restrict it via
    # .Values.turn.service.relay.minPort/maxPort if your provider caps the
    # number of Service ports. sprig's add1 returns int64 but untilStep
    # requires int, so wrap the exclusive upper bound back through int.
    {{- $relayStart := int .Values.turn.service.relay.minPort }}
    {{- $relayStop := int (add1 .Values.turn.service.relay.maxPort) }}
    {{- range $port := untilStep $relayStart $relayStop 1 }}
    - name: "relay-{{ $port }}"
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
    {{- end }}
    {{- end }}
{{- end }}
