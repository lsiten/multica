# Prebuilt fork images, published by the Fork Images workflow.
# Use make selfhost-images, or combine with the base file and up --no-build.
services:
  backend:
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/lsiten/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    pull_policy: always
  frontend:
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/lsiten/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    pull_policy: always
